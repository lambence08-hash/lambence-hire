<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Login — Lambence Hire</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="logo">Lambence<span>Hire</span></a>
    </div>
  </nav>

  <div class="form-page">
    <div class="form-box">
      <h2>School / College Login</h2>
      <p class="subtitle">Access your hiring dashboard</p>
      <div class="error-msg" id="errMsg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="admin@school.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit" class="btn-primary form-submit">Login</button>
      </form>

      <p class="form-link">New institution? <a href="school-register.html">Register here</a></p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('errMsg');
      err.style.display = 'none';

      try {
        const res = await fetch('/api/auth/school/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
        });
        const data = await res.json();
        if (!res.ok) { err.textContent = data.error; err.style.display = 'block'; return; }
        localStorage.setItem('schoolToken', data.token);
        localStorage.setItem('schoolData', JSON.stringify(data.school));
        window.location.href = 'school-dashboard.html';
      } catch {
        err.textContent = 'Server error. Please try again.';
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
