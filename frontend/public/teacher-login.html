<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Login — Lambence Hire</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="logo">Lambence<span>Hire</span></a>
    </div>
  </nav>

  <div class="form-page">
    <div class="form-box">
      <h2>Teacher Login</h2>
      <p class="subtitle">Access your profile and job applications</p>
      <div class="error-msg" id="errMsg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit" class="btn-primary form-submit">Login</button>
      </form>

      <p class="form-link">New teacher? <a href="teacher-register.html">Register free</a></p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect');
    const pendingJobId = localStorage.getItem('pendingApplyJobId');

    // Show pending job banner
    if (pendingJobId && redirect === 'jobs') {
      const title = localStorage.getItem('pendingApplyTitle') || 'a job';
      const banner = document.createElement('div');
      banner.style.cssText = 'background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:0.9rem;color:#1e40af';
      banner.innerHTML = `🔖 Login to apply for <strong>${title}</strong>`;
      document.querySelector('.form-box').insertBefore(banner, document.querySelector('form'));
    }

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('errMsg');
      err.style.display = 'none';

      try {
        const res = await fetch('/api/auth/teacher/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
        });
        const data = await res.json();
        if (!res.ok) { err.textContent = data.error; err.style.display = 'block'; return; }
        localStorage.setItem('teacherToken', data.token);
        localStorage.setItem('teacherData', JSON.stringify(data.teacher));

        // Redirect back to jobs and auto-open apply modal
        if (redirect === 'jobs' && pendingJobId) {
          window.location.href = 'jobs.html?applyJobId=' + pendingJobId;
        } else {
          window.location.href = 'teacher-dashboard.html';
        }
      } catch {
        err.textContent = 'Server error. Please try again.';
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
