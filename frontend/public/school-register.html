<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Register — Lambence Hire</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="logo">Lambence<span>Hire</span></a>
    </div>
  </nav>

  <div class="form-page">
    <div class="form-box" style="max-width:560px">
      <h2>Register Your Institution</h2>
      <p class="subtitle">Schools, Colleges & Coaching Institutes</p>
      <div class="error-msg" id="errMsg"></div>
      <div class="success-msg" id="okMsg"></div>

      <form id="regForm">
        <div class="form-row">
          <div class="form-group">
            <label>Institution Name *</label>
            <input type="text" id="name" placeholder="e.g. DPS Greater Noida" required />
          </div>
          <div class="form-group">
            <label>Type *</label>
            <select id="type" required>
              <option value="">Select type</option>
              <option value="school">School (K-12)</option>
              <option value="college">College / University</option>
              <option value="coaching">Coaching Institute</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Email *</label>
            <input type="email" id="email" placeholder="admin@school.com" required />
          </div>
          <div class="form-group">
            <label>Password *</label>
            <input type="password" id="password" placeholder="Min 6 characters" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Board / Affiliation</label>
            <select id="board">
              <option value="">Select board</option>
              <option value="CBSE">CBSE</option>
              <option value="ICSE">ICSE</option>
              <option value="State Board">State Board</option>
              <option value="IB">IB</option>
              <option value="University">University</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="phone" placeholder="Contact number" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>City *</label>
            <input type="text" id="city" placeholder="e.g. Delhi" required />
          </div>
          <div class="form-group">
            <label>State *</label>
            <input type="text" id="state" placeholder="e.g. Delhi" required />
          </div>
        </div>

        <div class="form-group">
          <label>Contact Person Name</label>
          <input type="text" id="contactPerson" placeholder="Principal / HR name" />
        </div>

        <button type="submit" class="btn-primary form-submit">Register Institution</button>
      </form>

      <p class="form-link">Already registered? <a href="school-login.html">Login here</a></p>
    </div>
  </div>

  <script>
    document.getElementById('regForm').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('errMsg');
      const ok = document.getElementById('okMsg');
      err.style.display = 'none';

      const body = {
        name: document.getElementById('name').value,
        type: document.getElementById('type').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        board: document.getElementById('board').value,
        phone: document.getElementById('phone').value,
        city: document.getElementById('city').value,
        state: document.getElementById('state').value,
        contactPerson: document.getElementById('contactPerson').value
      };

      try {
        const res = await fetch('/api/auth/school/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) { err.textContent = data.error; err.style.display = 'block'; return; }
        localStorage.setItem('schoolToken', data.token);
        localStorage.setItem('schoolData', JSON.stringify(data.school));
        ok.textContent = 'Registered successfully! Redirecting...';
        ok.style.display = 'block';
        setTimeout(() => window.location.href = 'school-dashboard.html', 1200);
      } catch {
        err.textContent = 'Server error. Please try again.';
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
